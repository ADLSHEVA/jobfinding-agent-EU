[project]
name = "eu-job-agent"
version = "0.1.0"
description = "Job-search agent for junior international graduates who want to work in Europe — covers visa-sponsoring SMEs and international organisations beyond LinkedIn."
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"  # Streamlit/watchdog/pydantic are unstable on 3.14; cap below it
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "certifi>=2024.0",  # reliable TLS trust store for stdlib urllib (macOS has none)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
]
llm = [
    "openai>=1.40",  # DeepSeek speaks the OpenAI protocol; used via base_url
]
ui = [
    "streamlit>=1.36",
]
docx = [
    "python-docx>=1.1",  # tailored CV variant export
]
scrape = [
    "scrapling[all]>=0.4.8",  # stealth/JS career-page crawling (run `scrapling install` after)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
