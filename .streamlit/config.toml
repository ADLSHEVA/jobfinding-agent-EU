# Show full error details in the app (so failures surface instead of a blank page).
[client]
showErrorDetails = "full"

# Disable the file-change watcher. On Streamlit Community Cloud it recursively
# schedules an inotify watch per directory and exhausts the OS inotify instance
# limit (`OSError: [Errno 24] inotify instance limit reached`), flooding the logs.
# The watcher only powers local hot-reload, which is useless in a deployed app.
[server]
fileWatcherType = "none"
